name: CI — science tests and web build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Python tests (engine specs, calibration properties, data contracts on the published JSON)
        run: |
          uv sync --locked
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend unit tests, type-check and build of the web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
