[project]
name = "trend-detective"
version = "0.1.0"
description = "NASA Space Apps 2026 - Be An Earth System Trend Detective! (team ProGarLabs)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "requests>=2.31",
    "pymannkendall>=1.4.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
